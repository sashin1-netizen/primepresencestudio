name: Deploy Prime Presence Preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-prime-presence-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website preview branch
        uses: actions/checkout@v4
        with:
          ref: agent/finish-prime-presence-atelier

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build static Pages preview
        working-directory: website
        run: npm run build
        env:
          GITHUB_PAGES_PREVIEW: "true"
          PUBLIC_LAUNCH_APPROVED: "false"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
