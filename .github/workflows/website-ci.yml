name: Website CI

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  push:
    branches:
      - "agent/finish-prime-presence-atelier"
      - "codex/website-cinematic-production"
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Refresh lockfile for patched overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile on working branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/finish-prime-presence-atelier'
        working-directory: .
        run: |
          if ! git diff --quiet -- website/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website/package-lock.json
            git commit -m "Update lockfile for patched nanoid"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate content model
        run: npm run content:validate

      - name: Production build safety check
        run: npm run build
        env:
          PUBLIC_LAUNCH_APPROVED: "false"
