name: Publish Atelier to gh-pages

on:
  pull_request:
    branches:
      - codex/website-cinematic-production
    paths:
      - "website/**"
      - ".github/workflows/website-gh-pages-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-presence-gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: agent/finish-prime-presence-atelier
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Install browser QA tooling
        working-directory: website
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Build browser QA preview
        working-directory: website
        run: npm run build
        env:
          PUBLIC_LAUNCH_APPROVED: "false"

      - name: Start browser QA server
        working-directory: website
        run: |
          npm start -- -p 3000 > /tmp/prime-presence-next.log 2>&1 &
          echo $! > /tmp/prime-presence-next.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prime-presence-next.log
          exit 1

      - name: Require cross-browser QA
        working-directory: website
        run: node scripts/cross-browser-qa.mjs

      - name: Stop browser QA server
        if: always()
        run: |
          if [ -f /tmp/prime-presence-next.pid ]; then
            kill "$(cat /tmp/prime-presence-next.pid)" || true
          fi

      - name: Build static preview
        working-directory: website
        run: npm run build
        env:
          GITHUB_PAGES_PREVIEW: "true"
          PUBLIC_LAUNCH_APPROVED: "false"

      - name: Publish to gh-pages
        run: |
          cd website/out
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Prime Presence Atelier preview"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
