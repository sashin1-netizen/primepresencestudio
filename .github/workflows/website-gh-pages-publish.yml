name: Publish Atelier to gh-pages

on:
  push:
    branches:
      - agent/finish-prime-presence-atelier
    paths:
      - "website/**"
      - ".github/workflows/website-gh-pages-publish.yml"
  pull_request:
    branches:
      - codex/website-cinematic-production
    paths:
      - "website/**"
      - ".github/workflows/website-gh-pages-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-presence-gh-pages-publish-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: agent/finish-prime-presence-atelier
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build static preview
        working-directory: website
        run: npm run build
        env:
          GITHUB_PAGES_PREVIEW: "true"
          PUBLIC_LAUNCH_APPROVED: "false"

      - name: Publish to gh-pages
        run: |
          cd website/out
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Prime Presence Atelier preview"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
